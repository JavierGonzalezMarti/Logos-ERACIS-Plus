[package]
name = "logos-eracis-plus"
version = "0.82.1"
description = "Herramienta para la inclusión de logotipos ERACIS Plus"
authors = ["Asociación para la mediación social EQUA"]
edition = "2021"

[lib]
name = "logos_eracis_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
